<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probar API REST</title>
    <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=U2-PKVeylmprnEFX5zivxgW_uSZvntO1TrnNrrmMYQ9ZvHIpVFaLj72CvRGhfq5P2brmZR5F0Q_ZRt4wXNA5as_sygUjOWX-VAuxUNsvMxMOptMYFWjQWqsfdqLOPatB0QzcLiYXttsrBs8A533s9UB95mDslOmKehPF9I-buRAJMA7p9xsyEb1Z1snixzAp" charset="UTF-8"></script><style>
      article {
       border: 1px solid #ccc;
       padding: 1rem;
       margin-bottom: 1rem;
      }

      img {
        height: auto;
        width: 320px;
        max-width: 100%;
      }
    </style>
    <script type="module">
        const API_BASES = [
          'http://localhost:3001',
          'http://localhost:3000'
        ]

        const getMovies = async () => {
          for (const baseUrl of API_BASES) {
            try {
              const response = await fetch(`${baseUrl}/movies`)
              if (!response.ok) continue

              const movies = await response.json()
              return { baseUrl, movies }
            } catch {
              // Try the next backend.
            }
          }

          throw new Error('No backend available on localhost:3001 or localhost:3000')
        }

        const renderMovies = async () => {
          const { baseUrl, movies } = await getMovies()

          const html = movies.map(movie => {
            return `
                <article data-id="${movie._id || movie.id}">
                    <h2>${movie.title}</h2>
                    <img src="${movie.poster}" alt="${movie.title}">
                    <p>${movie.year}</p>
                    <button>Eliminar</button>
                </article>
                `
          }).join('')

          document.querySelector('main').innerHTML = html

          document.addEventListener('click', async e => {
            if (!e.target.matches('button')) return

            const article = e.target.closest('article')
            const id = article.dataset.id

            const response = await fetch(`${baseUrl}/movies/${id}`, {
              method: 'DELETE'
            })

            if (response.ok) {
              article.remove()
            }
          })
        }

        renderMovies()
    </script>
  </head>
  <body>
    <main></main>
  </body>
</html>
