<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probar API REST</title>
    <script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=U2-PKVeylmprnEFX5zivxgW_uSZvntO1TrnNrrmMYQ9ZvHIpVFaLj72CvRGhfq5P2brmZR5F0Q_ZRt4wXNA5as_sygUjOWX-VAuxUNsvMxMOptMYFWjQWqsfdqLOPatB0QzcLiYXttsrBs8A533s9UB95mDslOmKehPF9I-buRAJMA7p9xsyEb1Z1snixzAp" charset="UTF-8"></script><style>
      article {
       border: 1px solid #ccc;
       padding: 1rem;
       margin-bottom: 1rem;
      }

      img {
        height: auto;
        width: 320px;
        max-width: 100%;
      }
    </style>
    <script type="module">
      const BACKENDS = {
        mongo: 'http://localhost:3000',
        local: 'http://localhost:3001',
        mysql: 'http://localhost:3002'
      }

      const params = new URLSearchParams(window.location.search)
      // Force Mongo by default to avoid being stuck on a previously saved backend.
      const defaultDb = params.get('db') || 'mongo'
      const dbSelect = document.querySelector('#db-select')
      const status = document.querySelector('#status')

      dbSelect.value = BACKENDS[defaultDb] ? defaultDb : 'mongo'

      const getMovies = async (baseUrl) => {
        const response = await fetch(`${baseUrl}/movies`)
        if (!response.ok) throw new Error(`HTTP ${response.status}`)
        const movies = await response.json()
        return movies
      }

      const renderMovies = async () => {
        const selectedDb = dbSelect.value
        const baseUrl = BACKENDS[selectedDb]

        status.textContent = `Cargando desde ${selectedDb.toUpperCase()} (${baseUrl})...`

        try {
          const movies = await getMovies(baseUrl)
          const placeholder = 'https://via.placeholder.com/320x480?text=No+Image'

          const html = movies.map(movie => {
            const poster = movie.poster || placeholder
            return `
              <article data-id="${movie._id || movie.id}">
                <h2>${movie.title}</h2>
                <img src="${poster}" alt="${movie.title}" onerror="this.onerror=null;this.src='${placeholder}'">
                <p>${movie.year}</p>
                <button>Eliminar</button>
              </article>
            `
          }).join('')

          document.querySelector('main').innerHTML = html || '<p>Sin peliculas.</p>'
          status.textContent = `Mostrando ${movies.length} peliculas desde ${selectedDb.toUpperCase()}`

          localStorage.setItem('db', selectedDb)
        } catch (error) {
          document.querySelector('main').innerHTML = '<p>No se pudieron cargar peliculas.</p>'
          status.textContent = `Error en ${selectedDb.toUpperCase()}: ${error.message}`
        }
      }

      document.querySelector('#reload').addEventListener('click', renderMovies)

      dbSelect.addEventListener('change', () => {
        renderMovies()
      })

      document.addEventListener('click', async e => {
        if (!e.target.matches('button')) return

        const selectedDb = dbSelect.value
        const baseUrl = BACKENDS[selectedDb]
        const article = e.target.closest('article')
        if (!article) return

        const id = article.dataset.id
        const response = await fetch(`${baseUrl}/movies/${id}`, { method: 'DELETE' })
        if (response.ok) article.remove()
      })

      renderMovies()
    </script>
  </head>
  <body>
    <section>
      <label for="db-select">Backend:</label>
      <select id="db-select">
        <option value="mongo">Mongo (3000)</option>
        <option value="local">Local (3001)</option>
        <option value="mysql">MySQL (3002)</option>
      </select>
      <button id="reload" type="button">Recargar</button>
      <p id="status"></p>
    </section>
    <main></main>
  </body>
</html>
